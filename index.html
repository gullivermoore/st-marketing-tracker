<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sunday Treat · Marketing Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1a2e; --coral:#ff5e5b; --paper:#faf8f4; --card:#ffffff;
    --line:#ece7de; --line2:#e0dcd3; --muted:#9a9aac; --muted2:#8a8a9a;
    --green:#1f6f4a; --amber:#c8922a; --red:#c0392b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}
  .wrap{max-width:1000px;margin:0 auto;padding:24px 26px 48px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--coral);outline-offset:1px;}
  button{font-family:'Inter',sans-serif;}

  header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;gap:16px;flex-wrap:wrap;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:32px;margin:0;letter-spacing:-.02em;line-height:1.05;}
  .hRight{display:flex;align-items:center;gap:12px;}
  .status-pill{font-size:11px;font-weight:600;padding:5px 10px;border-radius:20px;background:#eee;color:var(--muted2);}
  .status-pill.ok{background:#e5f3ec;color:var(--green);}
  .status-pill.err{background:#fbe9e7;color:var(--red);}
  .status-pill.sync{background:#fef4e0;color:var(--amber);}

  .weekBar{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .wNav{width:34px;height:34px;border-radius:8px;border:1px solid var(--line2);background:#fff;font-size:20px;cursor:pointer;color:var(--ink);line-height:1;}
  .wMain{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;}
  .wSub{font-size:11px;color:var(--muted);}
  .todayBtn{margin-left:4px;font-size:12px;padding:5px 11px;border-radius:6px;border:1px solid var(--line2);background:#fff;cursor:pointer;}

  .summary{display:flex;gap:26px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 22px;margin-bottom:24px;flex-wrap:wrap;}
  .stat .v{font-size:24px;font-weight:700;font-family:'Space Grotesk',sans-serif;line-height:1.1;}
  .stat .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:3px;}
  .vDiv{width:1px;align-self:stretch;background:var(--line);}

  .catLabel{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--coral);font-weight:700;margin:20px 0 8px;}
  .row{display:grid;grid-template-columns:230px 1fr;gap:14px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:7px;}
  .row.paused{opacity:.62;}
  .row.owner{background:#fdf2f1;border-color:#f3d6d3;border-left:3px solid var(--coral);}
  .row.star{background:#fffaea;border-color:#f0e0a8;border-left:3px solid #e8b923;}
  .row.oli{background:#eef4fb;border-color:#cfe0f2;border-left:3px solid #4a90d9;}
  .starTag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#8a6a00;background:#faedb8;padding:2px 7px;border-radius:4px;margin-left:6px;vertical-align:middle;}
  .ownerTag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#c0392b;background:#f8dbd8;padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:middle;}
  .rowHead{padding-top:5px;}
  .actName{font-weight:600;font-size:14px;}
  .actMeta{font-size:11px;color:var(--muted);margin-top:1px;}
  .actSub{font-size:11px;color:var(--muted2);margin-top:4px;font-style:italic;}
  .liveseqWrap{width:100%;}
  .liveseqWrap>label{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;display:block;margin-bottom:5px;}
  .seqGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .seqIn{padding:7px 9px;border-radius:7px;border:1px solid var(--line2);font-size:12.5px;font-family:'Inter',sans-serif;width:100%;}
  .wdWrap{display:flex;flex-direction:column;gap:8px;width:100%;}
  .wdRow{display:flex;align-items:center;gap:10px;}
  .wdLabel{width:82px;flex-shrink:0;font-size:11px;color:var(--muted2);font-weight:600;}
  .wdIn{flex:1;padding:7px 10px;border-radius:7px;border:1px solid var(--line2);font-size:12.5px;font-family:'Inter',sans-serif;}
  .seoWrap{width:100%;}
  .seoFields{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:16px;}
  .seoField{max-width:220px;}
  .seoField label{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;display:block;margin-bottom:3px;}
  .seoSub{font-size:10.5px;color:var(--muted2);margin-top:5px;line-height:1.4;}
  .seoSub .dim,.dim{color:var(--muted);}
  .seoGraphs{border-top:0.5px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:14px;}
  .spark .spLabel{font-size:11px;color:var(--muted2);margin-bottom:4px;}
  .spEmpty{font-size:11px;color:var(--muted);font-style:italic;padding:8px 0;}
  .seoLinks{border-top:0.5px solid var(--line);padding-top:14px;margin-top:14px;display:flex;flex-direction:column;gap:10px;}
  .seoLinkField label{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;display:block;margin-bottom:3px;}
  .postsGraph{flex-basis:100%;width:100%;border-top:0.5px solid var(--line);padding-top:10px;margin-top:4px;max-width:520px;}
  .pausedTag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted2);background:#efece6;padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:middle;}

  .fields{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;}
  .field{display:flex;flex-direction:column;gap:3px;}
  .field label{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;}
  .numIn{padding:7px 9px;border-radius:7px;border:1px solid var(--line2);font-size:13px;width:82px;font-family:'Inter',sans-serif;}
  .numIn.big{width:96px;}
  .txtIn{padding:7px 10px;border-radius:7px;border:1px solid var(--line2);font-size:13px;font-family:'Inter',sans-serif;min-width:180px;flex:1;}
  .whoIn{min-width:180px;}
  .noteIn{min-width:220px;}
  .derived{font-size:12px;font-weight:600;color:var(--green);white-space:nowrap;}
  .derivedLabel{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;display:block;}

  /* plan/done stacked block */
  .pd{display:flex;flex-direction:column;gap:8px;width:100%;}
  .planBanner{background:#fff6e9;border:1px solid #f2dfba;border-left:3px solid var(--amber);border-radius:8px;padding:8px 11px;font-size:12.5px;color:#7a5a1a;}
  .planBanner .bl{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:#b58a3a;font-weight:700;display:block;margin-bottom:2px;}
  .pdGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .pdGrid .field{gap:4px;}
  textarea{padding:8px 10px;border-radius:7px;border:1px solid var(--line2);font-size:13px;font-family:'Inter',sans-serif;resize:vertical;min-height:52px;width:100%;}
  textarea.planNext{border-color:#e6cfa0;background:#fffdf8;}

  footer{margin-top:30px;font-size:11.5px;color:#a5a5b5;line-height:1.5;}
  .gate{max-width:360px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;text-align:center;}
  .gate h2{font-family:'Space Grotesk',sans-serif;margin:0 0 6px;}
  .gate p{font-size:13px;color:var(--muted2);margin:0 0 18px;}
  .gate input{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line2);font-size:14px;margin-bottom:12px;}
  .gate button{width:100%;padding:11px;border-radius:9px;border:none;background:var(--ink);color:#fff;font-weight:600;cursor:pointer;}

  @media(max-width:720px){
    .row{grid-template-columns:1fr;gap:10px;}
    .txtIn,.whoIn,.noteIn{min-width:0;width:100%;}
    .pdGrid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ============================================================
// CONFIG
const API_URL = "https://script.google.com/a/macros/sundaytreat.com/s/AKfycbxSPogI_rD0mZ2ihZLaxdQt8cW3sNm1kEON_ml0lpyJhgENaMQ69H3ePx9JNTELTU05/exec";
const PASSPHRASE = "findthefun"; // must match Code.gs
// ============================================================

// Field types per row:
//   posts,views  -> number boxes (+ avg/post shown)
//   count        -> number box
//   who          -> text box "who / detail"
//   note         -> text box "note"
//   spend        -> number box "spend £"
//   plandone     -> "Done this week" + "Plan for next week" textareas,
//                   with last week's plan shown as a banner
// To UNPAUSE a paused row: change its trailing ,true] to ,false].
const ACTIVITIES = [
  // id, name, category, meta, fields[], paused, owner(red=Gully), star, oli, sub
  ["req-ref","Requested referrals","Priority","Weekly · commercial mindset in the team",["count","plandone"],false,false,true,false,"Commercial mindset within the team"],

  ["li-st","LinkedIn: Sunday Treat","Organic Social","Weekly",["posts","views","engagement"],false,false],
  ["li-g","LinkedIn: Gully","Organic Social","Weekly",["posts","views","engagement"],false,true],
  ["tt-st","TikTok: Sunday Treat","Organic Social","Weekly",["posts","views"],false,false],
  ["ig-st","Instagram: Sunday Treat","Organic Social","Weekly",["posts","views"],false,false],
  ["li-o","LinkedIn: Oli","Organic Social","Weekly",["posts","views"],false,false,false,"oli"],

  ["news","Newsletter","Content","Target: monthly",["count","plandone"],false,false],
  ["pod","Podcast","Content","Target: fortnightly",["count","plandone"],false,false],
  ["sandwich","New Business Sandwich","Content","Done this week + plan for next",["plandone"],false,false],

  ["gully-old","Gully's Client Outreach","Outbound","Weekly · daily log",["count","weekdays"],false,true],
  ["abm","ABM LinkedIn Outreach","Outbound","Weekly · ~3-4/day",["count","plandone"],false,false],
  ["apollo","Apollo Outreach","Outbound","Weekly · ~100-500 emails/day",["count","liveseq"],false,false],
  ["growth","Growth Consulting","Outbound","Weekly · ~50 emails/wk (senior)",["count","plandone"],false,false],

  ["partner","Partnership conversations","Business Dev","Weekly",["count","plandone"],false,false],
  ["network","Networking events","Business Dev","Weekly",["count","plandone"],false,false],
  ["tenders","Response to tenders","Business Dev","Weekly",["count","plandone"],true,false],
  ["speaking","Speaking at events","Business Dev","Weekly",["count","plandone"],false,false],
  ["awards","Award submissions","Business Dev","Weekly",["count","plandone"],false,false],
  ["st-events","Sunday Treat events","Business Dev","Weekly",["count","plandone"],false,false],

  ["paid-tt","Paid social: TikTok","Paid","Active videos + spend",["count","spend"],true,false],
  ["paid-li","Paid social: LinkedIn","Paid","Active videos + spend",["count","spend"],true,false],
  ["paid-ig","Paid social: Instagram","Paid","Active videos + spend",["count","spend"],true,false],
  ["paid-ppc","Paid social: Google PPC","Paid","TBC on tracking",["count","spend"],true,false],

  ["seo","SEO","Owned","Weekly tracking",["seo"],false,false],

  ["additional","Additional tasks","Additional tasks","Done this week + plan for next",["plandone"],false,false],
].map(function(a){return {id:a[0],name:a[1],cat:a[2],meta:a[3],fields:a[4],paused:a[5],owner:a[6],star:a[7],oli:a[8]==="oli",sub:a[9]||""};});

const CAT_ORDER=["Priority","Organic Social","Content","Outbound","Business Dev","Paid","Owned","Additional tasks"];
// ids whose count triggers a summary recalc / feeds the header stats
const SUMMARY_COUNT_IDS=["abm","req-ref"];
const LABELS={posts:"Posts",views:"Views",count:"Count",spend:"Spend £",who:"Who",note:"Note"};

// ---- state ----
let weekOffset=0;
let data={};      // data[`${wk}|${id}`] = {posts,views,count,spend,who,note,plan}
let authed=false;
let syncState={cls:"",txt:"—"};

// ---- week helpers ----
function mondayOf(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x;}
function addWeeks(d,n){const x=new Date(d);x.setDate(x.getDate()+n*7);return x;}
function fmtWeek(d){return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short"});}
function weekKey(d){const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;}
function currentMonday(){return addWeeks(mondayOf(new Date()),weekOffset);}
function wkStr(){return weekKey(currentMonday());}
function prevWkStr(){return weekKey(addWeeks(currentMonday(),-1));}

// ---- API ----
async function loadAll(){
  setSync("sync","Loading…");
  try{
    const res=await fetch(API_URL);
    const d=await res.json();
    if(!d.ok) throw new Error(d.error||"read failed");
    data={};
    (d.weekly||[]).forEach(r=>{
      if(r.Week&&r.ActivityId){
        data[`${r.Week}|${r.ActivityId}`]={
          posts:r.Posts,views:r.Views,engagement:r.Engagement,count:r.Count,spend:r.Spend,
          who:r.Who,note:r.Note,plan:r.Plan,avgpos:r.AvgPos,top3:r.Top3
        };
      }
    });
    setSync("ok","Synced");
  }catch(err){ setSync("err","Offline — "+err.message); }
  render();
}
async function push(id){
  const a=ACTIVITIES.find(x=>x.id===id);
  const v=data[`${wkStr()}|${id}`]||{};
  setSync("sync","Saving…");
  try{
    await fetch(API_URL,{method:"POST",body:JSON.stringify({
      pass:PASSPHRASE,week:wkStr(),activityId:id,activity:a.name,category:a.cat,
      posts:v.posts||"",views:v.views||"",engagement:v.engagement||"",count:v.count||"",spend:v.spend||"",
      who:v.who||"",note:v.note||"",plan:v.plan||"",avgpos:v.avgpos||"",top3:v.top3||""
    })});
    setSync("ok","Saved");
  }catch(err){ setSync("err","Save failed"); }
}
function setVal(id,field,val){
  const k=`${wkStr()}|${id}`;
  data[k]={...(data[k]||{}),[field]:val};
  clearTimeout(setVal._t);
  setVal._t=setTimeout(()=>push(id),700);
}
function getVal(id){return data[`${wkStr()}|${id}`]||{};}
function setSeq(id,idx,val){
  const k=`${wkStr()}|${id}`;
  const cur=(data[k]&&data[k].note!=null?String(data[k].note):"");
  const seqs=cur.split(" ||| ");
  while(seqs.length<8) seqs.push("");
  seqs[idx]=val;
  // trim trailing empties for cleanliness
  let last=7; while(last>=0&&!seqs[last]) last--;
  const packed=seqs.slice(0,last+1).join(" ||| ");
  data[k]={...(data[k]||{}),note:packed};
  clearTimeout(setSeq._t);
  setSeq._t=setTimeout(()=>push(id),700);
}
function setWeekday(id,idx,val){
  const k=`${wkStr()}|${id}`;
  const cur=(data[k]&&data[k].note!=null?String(data[k].note):"");
  const days=cur.split(" ||| ");
  while(days.length<5) days.push("");
  days[idx]=val;
  let last=4; while(last>=0&&!days[last]) last--;
  const packed=days.slice(0,last+1).join(" ||| ");
  data[k]={...(data[k]||{}),note:packed};
  clearTimeout(setWeekday._t);
  setWeekday._t=setTimeout(()=>push(id),700);
}

// ---- sync pill ----
function setSync(cls,txt){syncState={cls,txt};const el=document.getElementById("syncPill");if(el){el.className="status-pill "+cls;el.textContent=txt;}}

// ---- render ----
function render(){
  const app=document.getElementById("app");
  if(!authed){renderGate(app);return;}
  const cm=currentMonday(), wk=wkStr();

  let totalPosts=0, totalABM=0, totalReqRef=0;
  ACTIVITIES.forEach(a=>{
    const v=data[`${wk}|${a.id}`]||{};
    if(a.fields.includes("posts")) totalPosts+=Number(v.posts)||0;
    if(a.id==="abm") totalABM+=Number(v.count)||0;
    if(a.id==="req-ref") totalReqRef+=Number(v.count)||0;
  });

  const grouped={}; CAT_ORDER.forEach(c=>grouped[c]=[]); ACTIVITIES.forEach(a=>grouped[a.cat].push(a));

  app.innerHTML=`
  <div class="wrap">
    <header>
      <h1>Sunday Treat<br>Marketing Tracker</h1>
      <div class="hRight">
        <span id="syncPill" class="status-pill ${syncState.cls}">${syncState.txt}</span>
        <button class="wNav" title="Refresh" onclick="loadAll()">⟳</button>
      </div>
    </header>

    <div class="weekBar">
      <button class="wNav" onclick="weekOffset--;render()">‹</button>
      <div>
        <div class="wMain">w/c ${fmtWeek(cm)}</div>
        <div class="wSub">${weekOffset===0?"This week":(weekOffset>0?"+"+weekOffset+" wk":weekOffset+" wk")}</div>
      </div>
      <button class="wNav" onclick="weekOffset++;render()">›</button>
      ${weekOffset!==0?`<button class="todayBtn" onclick="weekOffset=0;render()">Today</button>`:""}
    </div>

    <div class="summary">
      <div class="stat"><div class="v">${totalPosts}</div><div class="l">Total posts</div></div>
      <div class="vDiv"></div>
      <div class="stat"><div class="v">${totalABM.toLocaleString()}</div><div class="l">Total ABM outreach</div></div>
      <div class="vDiv"></div>
      <div class="stat"><div class="v">${totalReqRef.toLocaleString()}</div><div class="l">Requested referrals</div></div>
    </div>

    ${CAT_ORDER.filter(c=>grouped[c].length).map(cat=>`
      <div class="catLabel">${cat}</div>
      ${grouped[cat].map(a=>renderRow(a,wk)).join("")}
    `).join("")}

    <footer>Live data reads and writes straight to your Google Sheet. Shared with the team via one link. Changes save automatically. To reactivate a paused row, ask to flip it on.</footer>
  </div>`;
}

function renderRow(a,wk){
  const v=data[`${wk}|${a.id}`]||{};
  const hasPD=a.fields.includes("plandone");
  // simple (inline) fields = everything except plandone
  const inlineFields=a.fields.filter(f=>f!=="plandone");
  return `<div class="row${a.paused?" paused":""}${a.owner?" owner":""}${a.star?" star":""}${a.oli?" oli":""}">
    <div class="rowHead">
      <div class="actName">${a.name}${a.paused?'<span class="pausedTag">Paused</span>':''}${a.star?'<span class="starTag">★ Priority</span>':''}</div>
      <div class="actMeta">${a.meta}</div>
      ${a.sub?`<div class="actSub">${a.sub}</div>`:''}
    </div>
    <div class="fields">
      ${inlineFields.map(f=>fieldHTML(a,f,v)).join("")}
      ${a.fields.includes("posts")&&a.fields.includes("views")?avgHTML(v):""}
      ${hasPD?planDoneHTML(a):""}
      ${["li-st","li-g","li-o"].includes(a.id)?`<div class="postsGraph">${sparkline(a.id,'posts','Posts per week','','#534AB7',false)}</div>`:""}
    </div>
  </div>`;
}

function fieldHTML(a,f,v){
  const val=(v[f]!=null?String(v[f]):"").replace(/"/g,"&quot;");
  if(f==="liveseq"){
    const raw=(v.note!=null?String(v.note):"");
    const seqs=raw.split(" ||| ");
    let boxes="";
    for(let i=0;i<8;i++){
      const sv=(seqs[i]||"").replace(/"/g,"&quot;");
      boxes+=`<input class="seqIn" placeholder="sequence ${i+1}" value="${sv}" onchange="setSeq('${a.id}',${i},this.value)">`;
    }
    return `<div class="liveseqWrap">
      <label>Live sequences</label>
      <div class="seqGrid">${boxes}</div>
    </div>`;
  }
  if(f==="weekdays"){
    const raw=(v.note!=null?String(v.note):"");
    const parts=raw.split(" ||| ");
    const days=["Monday","Tuesday","Wednesday","Thursday","Friday"];
    let rows="";
    days.forEach((d,i)=>{
      const dv=(parts[i]||"").replace(/"/g,"&quot;");
      rows+=`<div class="wdRow"><span class="wdLabel">${d}</span><input class="wdIn" placeholder="who…" value="${dv}" onchange="setWeekday('${a.id}',${i},this.value)"></div>`;
    });
    return `<div class="wdWrap">${rows}</div>`;
  }
  if(f==="seo"){
    const ap=(v.avgpos!=null?String(v.avgpos):"").replace(/"/g,"&quot;");
    const t3=(v.top3!=null?String(v.top3):"").replace(/"/g,"&quot;");
    return `<div class="seoWrap">
      <div class="seoFields">
        <div class="seoField">
          <label>Average position</label>
          <input class="numIn" type="number" placeholder="0" value="${ap}" onchange="setVal('${a.id}','avgpos',this.value);render()">
          <div class="seoSub">On average where we rank across all our keywords <span class="dim">(lower is better)</span></div>
        </div>
        <div class="seoField">
          <label>Top 3 keyword count</label>
          <input class="numIn" type="number" placeholder="0" value="${t3}" onchange="setVal('${a.id}','top3',this.value);render()">
          <div class="seoSub">How many search terms we rank #1–#3 for</div>
        </div>
      </div>
      <div class="seoGraphs">
        ${sparkline('seo','avgpos','Average position','(lower is better)','#378ADD',true)}
        ${sparkline('seo','top3','Top 3 keyword count','(higher is better)','#1D9E75',false)}
      </div>
      <div class="seoLinks">
        <div class="seoLinkField">
          <label>SEO Ranking</label>
          <input class="txtIn" style="width:100%" placeholder="link or note…" value="${(v.who!=null?String(v.who):'').replace(/"/g,'&quot;')}" onchange="setVal('${a.id}','who',this.value)">
        </div>
        <div class="seoLinkField">
          <label>Task Manager</label>
          <input class="txtIn" style="width:100%" placeholder="link or note…" value="${(v.note!=null?String(v.note):'').replace(/"/g,'&quot;')}" onchange="setVal('${a.id}','note',this.value)">
        </div>
      </div>
    </div>`;
  }
  if(f==="engagement"){
    return `<div class="field">
      <label>Engagement</label>
      <input class="numIn big" type="number" placeholder="0" value="${val}" onchange="setVal('${a.id}','engagement',this.value)">
    </div>`;
  }
  if(f==="who"){
    return `<div class="field" style="flex:1">
      <label>Who</label>
      <input class="txtIn whoIn" placeholder="who / detail…" value="${val}" onchange="setVal('${a.id}','who',this.value)">
    </div>`;
  }
  if(f==="note"){
    return `<div class="field" style="flex:1">
      <label>Note</label>
      <input class="txtIn noteIn" placeholder="note…" value="${val}" onchange="setVal('${a.id}','note',this.value)">
    </div>`;
  }
  if(f==="spend"){
    return `<div class="field">
      <label>Spend £</label>
      <input class="numIn big" type="number" placeholder="0" value="${val}" onchange="setVal('${a.id}','spend',this.value)">
    </div>`;
  }
  if(f==="views"){
    return `<div class="field">
      <label>Views</label>
      <input class="numIn big" type="number" placeholder="0" value="${val}" onchange="setVal('${a.id}','views',this.value);render()">
    </div>`;
  }
  const label = f==="count" ? (a.fields.includes("spend")?"Videos":"Count") : LABELS[f];
  const rerender = (f==="posts"||(SUMMARY_COUNT_IDS.includes(a.id)&&f==="count")) ? ";render()" : "";
  return `<div class="field">
    <label>${label}</label>
    <input class="numIn" type="number" placeholder="0" value="${val}" onchange="setVal('${a.id}','${f}',this.value)${rerender}">
  </div>`;
}

function sparkline(actId,metric,label,dir,color,lowerBetter){
  // gather all weeks with a value for actId[metric]
  const pts=[];
  Object.keys(data).forEach(k=>{
    const [wk,aid]=k.split("|");
    if(aid!==actId) return;
    const raw=data[k][metric];
    if(raw===""||raw==null) return;
    const n=Number(raw);
    if(isNaN(n)) return;
    pts.push({wk,n});
  });
  pts.sort((a,b)=>a.wk<b.wk?-1:1);

  if(pts.length<2){
    return `<div class="spark">
      <div class="spLabel">${label} <span class="dim">${dir}</span></div>
      <div class="spEmpty">Log at least two weeks to see the trend.</div>
    </div>`;
  }

  const W=520,H=54,padL=6,padR=10,padT=8,padB=8;
  const vals=pts.map(p=>p.n);
  let mn=Math.min(...vals), mx=Math.max(...vals);
  if(mn===mx){mn=mn-1;mx=mx+1;}
  const x=i=>padL+(i/(pts.length-1))*(W-padL-padR);
  // for "lower is better" we still plot value directly but invert Y so smaller sits higher
  const y=val=>{
    const t=(val-mn)/(mx-mn); // 0..1
    // higher value -> higher on chart normally (smaller y). For lowerBetter, keep raw mapping; axis note explains.
    return padT+(1-t)*(H-padT-padB);
  };
  const poly=pts.map((p,i)=>`${x(i).toFixed(1)},${y(p.n).toFixed(1)}`).join(" ");
  const lastX=x(pts.length-1), lastY=y(pts[pts.length-1].n);
  const lastVal=pts[pts.length-1].n;

  return `<div class="spark">
    <div class="spLabel">${label} <span class="dim">${dir}</span></div>
    <svg viewBox="0 0 ${W} ${H+16}" width="100%" height="${H+16}" style="display:block">
      <polyline points="${poly}" fill="none" stroke="${color}" stroke-width="2"/>
      <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3.2" fill="${color}"/>
      <text x="${(lastX-6).toFixed(1)}" y="${(lastY-6).toFixed(1)}" style="font-size:10px;fill:${color};text-anchor:end">${lastVal}</text>
      <text x="${padL}" y="${H+12}" style="font-size:9px;fill:var(--muted)">${pts.length} wk ago</text>
      <text x="${W-padR}" y="${H+12}" style="font-size:9px;fill:var(--muted);text-anchor:end">now</text>
    </svg>
  </div>`;
}

function avgHTML(v){
  const avg=v.posts?Math.round((Number(v.views)||0)/Number(v.posts)):"";
  return `<div class="field">
    <span class="derivedLabel">Avg / post</span>
    <span class="derived">${avg===""?"–":avg.toLocaleString()}</span>
  </div>`;
}

function planDoneHTML(a){
  const v=data[`${wkStr()}|${a.id}`]||{};
  const prev=data[`${prevWkStr()}|${a.id}`]||{};
  const lastPlan=(prev.plan||"").trim();
  const done=(v.note!=null?String(v.note):"").replace(/</g,"&lt;");
  const plan=(v.plan!=null?String(v.plan):"").replace(/</g,"&lt;");
  const big=a.id==="additional"?' style="min-height:92px"':'';
  return `<div class="pd">
    ${lastPlan?`<div class="planBanner"><span class="bl">Last week's plan</span>${lastPlan.replace(/</g,"&lt;")}</div>`:""}
    <div class="pdGrid">
      <div class="field">
        <label>Done this week</label>
        <textarea${big} placeholder="what got done…" onchange="setVal('${a.id}','note',this.value)">${done}</textarea>
      </div>
      <div class="field">
        <label>Plan for next week</label>
        <textarea class="planNext"${big} placeholder="commit to next week…" onchange="setVal('${a.id}','plan',this.value)">${plan}</textarea>
      </div>
    </div>
  </div>`;
}

}

  const val=document.getElementById("pass").value;
  if(val===PASSPHRASE){authed=true;sessionStorage.setItem("st-auth","1");loadAll();}
  else{document.getElementById("pass").style.borderColor="var(--red)";}
}

// ---- boot ----
if(sessionStorage.getItem("st-auth")==="1"){authed=true;loadAll();}
else{render();}
