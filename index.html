<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sunday Treat · Marketing Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1a2e; --coral:#ff5e5b; --paper:#faf8f4; --card:#ffffff;
    --line:#ece7de; --line2:#e0dcd3; --muted:#9a9aac; --muted2:#8a8a9a;
    --green:#1f6f4a; --amber:#c8922a; --red:#c0392b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}
  .wrap{max-width:960px;margin:0 auto;padding:24px 26px 48px;}
  input:focus,select:focus{outline:2px solid var(--coral);outline-offset:1px;}
  select{cursor:pointer;}
  button{font-family:'Inter',sans-serif;}

  header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;gap:16px;flex-wrap:wrap;}
  .kicker{font-size:11px;letter-spacing:.18em;color:var(--coral);font-weight:600;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:34px;margin:4px 0 0;letter-spacing:-.02em;}
  .hRight{display:flex;align-items:center;gap:12px;}
  .status-pill{font-size:11px;font-weight:600;padding:5px 10px;border-radius:20px;background:#eee;color:var(--muted2);}
  .status-pill.ok{background:#e5f3ec;color:var(--green);}
  .status-pill.err{background:#fbe9e7;color:var(--red);}
  .status-pill.sync{background:#fef4e0;color:var(--amber);}

  .weekBar{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .wNav{width:34px;height:34px;border-radius:8px;border:1px solid var(--line2);background:#fff;font-size:20px;cursor:pointer;color:var(--ink);line-height:1;}
  .wMain{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;}
  .wSub{font-size:11px;color:var(--muted);}
  .todayBtn{margin-left:4px;font-size:12px;padding:5px 11px;border-radius:6px;border:1px solid var(--line2);background:#fff;cursor:pointer;}

  .summary{display:flex;gap:22px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:22px;flex-wrap:wrap;}
  .stat .v{font-size:22px;font-weight:700;font-family:'Space Grotesk',sans-serif;line-height:1.1;}
  .stat .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:3px;}
  .vDiv{width:1px;align-self:stretch;background:var(--line);}

  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;}
  .tab{padding:9px 18px;border:none;background:none;cursor:pointer;font-size:14px;font-family:'Space Grotesk',sans-serif;color:var(--muted);border-bottom:2.5px solid transparent;}
  .tab.active{font-weight:700;color:var(--ink);border-bottom-color:var(--coral);}

  .catLabel{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--coral);font-weight:700;margin:16px 0 6px;}
  .row{display:grid;grid-template-columns:1fr 132px 1.1fr;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:6px;}
  .actName{font-weight:600;font-size:13.5px;}
  .cadence{font-size:11px;color:var(--muted);}
  .sel{padding:7px 8px;border-radius:7px;border:1.5px solid;font-weight:600;font-size:12.5px;background:#fff;}
  .note{padding:7px 10px;border-radius:7px;border:1px solid var(--line2);font-size:12.5px;}

  .socialWrap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .socialHint{font-size:12.5px;color:var(--muted2);margin-bottom:14px;}
  .sHead,.sRow{display:grid;grid-template-columns:90px 1fr 80px 100px 100px 80px;gap:10px;align-items:center;}
  .sHead{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding-bottom:8px;border-bottom:1px solid var(--line);}
  .sRow{padding:9px 0;border-bottom:1px solid #f3efe8;}
  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px;text-align:center;}
  .badge.TikTok{background:var(--ink);color:#fff;}
  .badge.LinkedIn{background:#e8f0f7;color:#0a66c2;}
  .badge.Instagram{background:#fdeef4;color:#c13584;}
  .numIn{padding:7px 9px;border-radius:7px;border:1px solid var(--line2);font-size:13px;width:100%;}
  .avg{font-size:13px;font-weight:600;color:var(--green);}

  footer{margin-top:28px;font-size:11.5px;color:#a5a5b5;line-height:1.5;}
  .gate{max-width:360px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;text-align:center;}
  .gate h2{font-family:'Space Grotesk',sans-serif;margin:0 0 6px;}
  .gate p{font-size:13px;color:var(--muted2);margin:0 0 18px;}
  .gate input{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line2);font-size:14px;margin-bottom:12px;}
  .gate button{width:100%;padding:11px;border-radius:9px;border:none;background:var(--ink);color:#fff;font-weight:600;cursor:pointer;}
  @media(max-width:640px){
    .row{grid-template-columns:1fr;gap:8px;}
    .sHead{display:none;}
    .sRow{grid-template-columns:1fr 1fr;row-gap:6px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ============================================================
// CONFIG — paste your Apps Script /exec URL here after deploying
const API_URL = "PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE";
const PASSPHRASE = "findthefun"; // must match Code.gs
// ============================================================

const ACTIVITIES = [
  ["st-li","Sunday Treat LinkedIn","Organic Social","Weekly"],
  ["g-li","Gully LinkedIn","Organic Social","Weekly"],
  ["st-tt","Sunday Treat TikTok","Organic Social","Weekly"],
  ["g-tt","Gully TikTok","Organic Social","Weekly"],
  ["news","Newsletter","Content","Monthly"],
  ["pod","Podcast","Content","Weekly"],
  ["part","Partnerships","Business Dev","Ongoing"],
  ["net","In person networking","Business Dev","Ongoing"],
  ["tend","Response to tenders","Business Dev","As needed"],
  ["speak","Speaking at events","Business Dev","As needed"],
  ["li-out","LinkedIn Outreach","Outbound","Weekly"],
  ["apollo","Apollo Outreach","Outbound","Weekly"],
  ["sand","New Business Sandwich (inc UGC video)","Content","Weekly"],
  ["paid","Paid social","Paid","Ongoing"],
  ["seo","SEO","Owned","Ongoing"],
  ["awards","Awards (inc judges & fellow nominees)","Business Dev","As needed"],
  ["ref","Referrals","Business Dev","Ongoing"],
  ["comm","Commercial mindset for Amy & Emma","Team","Ongoing"],
].map(([id,name,cat,cadence])=>({id,name,cat,cadence}));

const STATUSES=["Not started","In progress","On track","Done","Blocked","Paused"];
const STATUS_COLOR={"Not started":"#9a9a9a","In progress":"#c8922a","On track":"#2e8b6b","Done":"#1f6f4a","Blocked":"#c0392b","Paused":"#7a6f9b"};
const CAT_ORDER=["Organic Social","Content","Outbound","Business Dev","Paid","Owned","Team"];
const SOCIAL_ACCOUNTS=[["TikTok","Sunday Treat"],["TikTok","Gully"],["LinkedIn","Sunday Treat"],["LinkedIn","Gully"],["Instagram","Sunday Treat"]];

// ---- state ----
let weekOffset=0, tab="weekly";
let weekly={}, social={};           // weekly[`${wk}|${id}`]={status,note}; social[`${wk}|${plat}|${acct}`]={posts,views,followers}
let authed=false;

// ---- week helpers ----
function mondayOf(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x;}
function addWeeks(d,n){const x=new Date(d);x.setDate(x.getDate()+n*7);return x;}
function fmtWeek(d){return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short"});}
function weekKey(d){return d.toISOString().slice(0,10);}
function currentMonday(){return addWeeks(mondayOf(new Date()),weekOffset);}
function wkStr(){return weekKey(currentMonday());}

// ---- API ----
async function loadAll(){
  setSync("sync","Loading…");
  try{
    const res=await fetch(API_URL);
    const data=await res.json();
    if(!data.ok) throw new Error(data.error||"read failed");
    weekly={}; social={};
    (data.weekly||[]).forEach(r=>{ if(r.Week&&r.ActivityId) weekly[`${r.Week}|${r.ActivityId}`]={status:r.Status||"",note:r.Note||""};});
    (data.social||[]).forEach(r=>{ if(r.Week&&r.Platform&&r.Account) social[`${r.Week}|${r.Platform}|${r.Account}`]={posts:r.Posts,views:r.Views,followers:r.Followers};});
    setSync("ok","Synced");
  }catch(err){ setSync("err","Offline — "+err.message); }
  render();
}

async function pushWeekly(id){
  const a=ACTIVITIES.find(x=>x.id===id); const v=weekly[`${wkStr()}|${id}`]||{};
  await post({type:"weekly",week:wkStr(),activityId:id,activity:a.name,category:a.cat,cadence:a.cadence,status:v.status||"",note:v.note||""});
}
async function pushSocial(plat,acct){
  const v=social[`${wkStr()}|${plat}|${acct}`]||{};
  await post({type:"social",week:wkStr(),platform:plat,account:acct,posts:v.posts||"",views:v.views||"",followers:v.followers||""});
}
async function post(payload){
  setSync("sync","Saving…");
  try{
    await fetch(API_URL,{method:"POST",body:JSON.stringify({...payload,pass:PASSPHRASE})});
    setSync("ok","Saved");
  }catch(err){ setSync("err","Save failed"); }
}

// ---- setters ----
function setStatus(id,field,val){const k=`${wkStr()}|${id}`;weekly[k]={...(weekly[k]||{}),[field]:val};clearTimeout(setStatus._t);setStatus._t=setTimeout(()=>pushWeekly(id),500);}
function setSoc(plat,acct,field,val){const k=`${wkStr()}|${plat}|${acct}`;social[k]={...(social[k]||{}),[field]:val};clearTimeout(setSoc._t);setSoc._t=setTimeout(()=>pushSocial(plat,acct),600);}

// ---- render ----
let syncState={cls:"",txt:""};
function setSync(cls,txt){syncState={cls,txt};const el=document.getElementById("syncPill");if(el){el.className="status-pill "+cls;el.textContent=txt;}}

function render(){
  const app=document.getElementById("app");
  if(!authed){ renderGate(app); return; }
  const cm=currentMonday(), wk=wkStr();

  // summary
  let done=0,active=0,blocked=0,touched=0,posts=0,views=0;
  ACTIVITIES.forEach(a=>{const st=(weekly[`${wk}|${a.id}`]||{}).status;if(st==="Done")done++;else if(st==="On track"||st==="In progress")active++;else if(st==="Blocked")blocked++;if(st)touched++;});
  SOCIAL_ACCOUNTS.forEach(([p,a])=>{const v=social[`${wk}|${p}|${a}`]||{};posts+=Number(v.posts)||0;views+=Number(v.views)||0;});

  const grouped={}; CAT_ORDER.forEach(c=>grouped[c]=[]); ACTIVITIES.forEach(a=>grouped[a.cat].push(a));

  app.innerHTML=`
  <div class="wrap">
    <header>
      <div>
        <div class="kicker">SUNDAY TREAT · FIND THE FUN</div>
        <h1>Marketing Tracker</h1>
      </div>
      <div class="hRight">
        <span id="syncPill" class="status-pill ${syncState.cls}">${syncState.txt||"—"}</span>
        <button class="wNav" title="Refresh" onclick="loadAll()">⟳</button>
      </div>
    </header>

    <div class="weekBar">
      <button class="wNav" onclick="weekOffset--;render()">‹</button>
      <div>
        <div class="wMain">w/c ${fmtWeek(cm)}</div>
        <div class="wSub">${weekOffset===0?"This week":(weekOffset>0?"+"+weekOffset+" wk":weekOffset+" wk")}</div>
      </div>
      <button class="wNav" onclick="weekOffset++;render()">›</button>
      ${weekOffset!==0?`<button class="todayBtn" onclick="weekOffset=0;render()">Today</button>`:""}
    </div>

    <div class="summary">
      <div class="stat"><div class="v">${touched}/${ACTIVITIES.length}</div><div class="l">Touched</div></div>
      <div class="stat"><div class="v" style="color:var(--green)">${done}</div><div class="l">Done</div></div>
      <div class="stat"><div class="v" style="color:var(--amber)">${active}</div><div class="l">Active</div></div>
      <div class="stat"><div class="v" style="color:var(--red)">${blocked}</div><div class="l">Blocked</div></div>
      <div class="vDiv"></div>
      <div class="stat"><div class="v">${posts}</div><div class="l">Posts</div></div>
      <div class="stat"><div class="v">${views.toLocaleString()}</div><div class="l">Views</div></div>
    </div>

    <div class="tabs">
      <button class="tab ${tab==="weekly"?"active":""}" onclick="tab='weekly';render()">Weekly status</button>
      <button class="tab ${tab==="social"?"active":""}" onclick="tab='social';render()">Social metrics</button>
    </div>

    ${tab==="weekly"?renderWeekly(grouped,wk):renderSocial(cm,wk)}

    <footer>Live data reads and writes straight to your Google Sheet. Shared with the team via one link. Changes save automatically.</footer>
  </div>`;
}

function renderWeekly(grouped,wk){
  return CAT_ORDER.filter(c=>grouped[c].length).map(cat=>`
    <div class="catLabel">${cat}</div>
    ${grouped[cat].map(a=>{
      const st=weekly[`${wk}|${a.id}`]||{};
      const cur=st.status||"Not started";
      return `<div class="row">
        <div><div class="actName">${a.name}</div><div class="cadence">${a.cadence}</div></div>
        <select class="sel" style="color:${STATUS_COLOR[cur]};border-color:${STATUS_COLOR[cur]}" onchange="setStatus('${a.id}','status',this.value);render()">
          ${STATUSES.map(s=>`<option ${s===cur?"selected":""}>${s}</option>`).join("")}
        </select>
        <input class="note" placeholder="note…" value="${(st.note||"").replace(/"/g,"&quot;")}" onchange="setStatus('${a.id}','note',this.value)">
      </div>`;
    }).join("")}
  `).join("");
}

function renderSocial(cm,wk){
  return `<div class="socialWrap">
    <div class="socialHint">Pull these from each platform's native analytics for w/c ${fmtWeek(cm)}.</div>
    <div class="sHead"><span>Platform</span><span>Account</span><span>Posts</span><span>Views</span><span>Followers</span><span>Avg/post</span></div>
    ${SOCIAL_ACCOUNTS.map(([p,a])=>{
      const v=social[`${wk}|${p}|${a}`]||{};
      const avg=v.posts?Math.round((Number(v.views)||0)/Number(v.posts)):"";
      return `<div class="sRow">
        <span class="badge ${p}">${p}</span>
        <span style="font-weight:500">${a}</span>
        <input class="numIn" type="number" value="${v.posts||""}" onchange="setSoc('${p}','${a}','posts',this.value);render()">
        <input class="numIn" type="number" value="${v.views||""}" onchange="setSoc('${p}','${a}','views',this.value);render()">
        <input class="numIn" type="number" value="${v.followers||""}" onchange="setSoc('${p}','${a}','followers',this.value)">
        <span class="avg">${avg===""?"–":avg.toLocaleString()}</span>
      </div>`;
    }).join("")}
  </div>`;
}

function renderGate(app){
  app.innerHTML=`<div class="gate">
    <h2>Marketing Tracker</h2>
    <p>Enter the team passphrase to open the tracker.</p>
    <input id="pass" type="password" placeholder="passphrase" onkeydown="if(event.key==='Enter')tryAuth()">
    <button onclick="tryAuth()">Open</button>
  </div>`;
}
function tryAuth(){
  const val=document.getElementById("pass").value;
  if(val===PASSPHRASE){authed=true;sessionStorage.setItem("st-auth","1");loadAll();}
  else{document.getElementById("pass").style.borderColor="var(--red)";}
}

// ---- boot ----
if(sessionStorage.getItem("st-auth")==="1"){authed=true;loadAll();}
else{render();}
</script>
</body>
</html>
